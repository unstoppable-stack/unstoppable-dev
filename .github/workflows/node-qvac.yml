name: Node Real QVAC

# Stable-release validation for the exact SDK bundled by Personal Node.
# Protect the qvac-validation environment with required reviewers so model
# downloads and native inference run only after explicit approval.
on:
  workflow_dispatch:
    inputs:
      model_src:
        description: 'QVAC model source: runner-reachable URL or preset'
        required: true
        type: string
      model_type:
        description: 'QVAC model type'
        required: false
        default: 'llm'
        type: string

jobs:
  real-qvac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    environment: qvac-validation
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install node deps
        working-directory: packages/node
        run: npm ci

      - name: Install the exact Node QVAC SDK without changing the lock
        working-directory: packages/node
        run: npm install --no-save --package-lock=false @qvac/sdk@0.21.0

      - name: Run real QVAC E2E
        working-directory: packages/node
        run: npm run test:qvac
        env:
          QVAC_MODEL_SRC: ${{ inputs.model_src }}
          QVAC_MODEL_TYPE: ${{ inputs.model_type }}
          QVAC_TEST_TIMEOUT: '3000000'
