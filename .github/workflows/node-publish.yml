name: Node Publish Validation (legacy)

# Kept as a harmless manual compatibility entry for existing bookmarks. The
# only workflow allowed to publish is node-release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Run the release gate
        run: node scripts/node-release-gate.mjs
      - name: Explain the publishing path
        run: echo "Validation passed. Use the approval-gated Node Release workflow to publish."
