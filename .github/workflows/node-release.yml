name: Node Release

# Publishing is manual and additionally protected by the npm-release GitHub
# environment. Keep the environment configured with required reviewers.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated tarballs to npm
        required: true
        default: false
        type: boolean
      dist_tag:
        description: npm distribution tag
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest

concurrency:
  group: node-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Validate release metadata and security controls
        run: node scripts/node-release-gate.mjs

      - name: Validate distribution tag
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          node --input-type=module -e "import pkg from './packages/node/package.json' with { type: 'json' }; if (pkg.version.includes('-') && process.env.DIST_TAG === 'latest') throw new Error('Prereleases must not publish to the latest tag')"

      - name: Install and test p2p
        working-directory: packages/p2p
        run: npm ci && npm audit --omit=dev --audit-level=high && npm test

      - name: Install and test node
        working-directory: packages/node
        run: npm ci && npm audit --omit=dev --audit-level=high && npm test

      - name: Pack publishable artifacts
        run: |
          mkdir -p release-artifacts
          node scripts/pack-node-release.mjs "$PWD/release-artifacts"
          node scripts/release-artifacts.mjs "$PWD/release-artifacts"
          node scripts/test-node-artifacts.mjs "$PWD/release-artifacts"
          sha256sum release-artifacts/*.tgz > release-artifacts/SHA256SUMS.txt

      - name: Upload validated tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-npm-${{ github.sha }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ inputs.publish }}
    needs: validate
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install trusted publishing npm CLI
        run: npm install --global npm@12.0.2

      - name: Download validated tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-npm-${{ github.sha }}
          path: release-artifacts

      - name: Require canonical P2P and refuse an existing Node version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const { artifacts } = JSON.parse(readFileSync('release-artifacts/artifact-manifest.json'))
          for (const artifact of artifacts) {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(artifact.name)}/${artifact.version}`, { signal: AbortSignal.timeout(20000) })
            if (artifact.name === '@unstoppable-stack/p2p') {
              assert(response.ok, 'Canonical P2P must already be published by public-packages.yml')
              const metadata = await response.json()
              const integrity = 'sha512-' + createHash('sha512').update(readFileSync(`release-artifacts/${artifact.file}`)).digest('base64')
              assert.equal(metadata.dist.integrity, integrity, 'Published P2P differs from the validated Node dependency')
            } else {
              assert.equal(response.status, 404, 'Node version exists or registry lookup failed')
            }
          }
          NODE

      - name: Verify downloaded artifacts
        run: sha256sum --check release-artifacts/SHA256SUMS.txt

      - name: Publish node
        run: npm publish ./release-artifacts/unstoppable-node-*.tgz --ignore-scripts --access public --tag "${{ inputs.dist_tag }}"
