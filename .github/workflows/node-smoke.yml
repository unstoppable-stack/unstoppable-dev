name: Node Smoke

on:
  push:
    branches: [main]
    paths:
      - 'packages/node/**'
      - 'packages/p2p/**'
      - 'packages/node-desktop/**'
      - 'examples/node-demo/**'
      - '.github/workflows/node-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/node/**'
      - 'packages/p2p/**'
      - 'packages/node-desktop/**'
      - 'examples/node-demo/**'
      - '.github/workflows/node-smoke.yml'
  workflow_dispatch:

jobs:
  headless-demo:
    name: Headless Bare demo
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bare/Pear runtimes
        run: npm install -g bare@latest pear@latest

      - name: Install node package deps
        working-directory: packages/node
        run: npm install

      - name: Install p2p package deps
        working-directory: packages/p2p
        run: npm install

      - name: Install node-desktop package deps
        working-directory: packages/node-desktop
        run: npm install

      - name: Install node-demo deps
        working-directory: examples/node-demo
        run: npm install

      - name: Run headless smoke test
        working-directory: packages/node-desktop
        run: npm run test:smoke
        env:
          NODE_SMOKE_RUNS: '20'
