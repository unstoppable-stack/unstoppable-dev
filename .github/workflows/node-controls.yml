name: Node Trust and Resource Controls

on:
  pull_request:
    paths: ['packages/node/**', 'packages/p2p/**', 'packages/node-desktop/**', 'examples/personal-node-ecosystem/**', '.github/workflows/node-controls.yml']
  push:
    branches: [main]
    paths: ['packages/node/**', 'packages/p2p/**', 'packages/node-desktop/**', 'examples/personal-node-ecosystem/**', '.github/workflows/node-controls.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Node control regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install runtime and capability dependencies
        run: |
          for package in p2p node; do
            npm ci --prefix "packages/$package"
          done
      - name: Exercise trust, grants, admission, cancellation and quotas
        # Serialize suites: their local DHT bootstrappers select ephemeral ports.
        run: node --test --test-force-exit --test-concurrency=1 --test-timeout=120000 packages/p2p/test/*.test.js packages/p2p/test/sync/*.test.js packages/node/test/*.test.js > node-controls.log 2>&1
      - name: Verify the two-app Personal Node example
        run: |
          npm ci --prefix examples/personal-node-ecosystem
          npm test --prefix examples/personal-node-ecosystem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-controls-${{ matrix.os }}
          path: node-controls.log
