name: Minimal Notes example

on:
  pull_request:
    paths:
      - 'examples/unstoppable-notes/**'
      - '.github/workflows/notes-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/unstoppable-notes/**'
      - '.github/workflows/notes-example.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-p2p-example:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: examples/unstoppable-notes
      - name: Check local persistence, sync and offline replica reopen
        run: npm test
        working-directory: examples/unstoppable-notes
