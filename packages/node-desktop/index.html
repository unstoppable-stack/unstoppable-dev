<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unstoppable Node</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      overflow: hidden;
    }
    #bar {
      -webkit-app-region: drag;
      height: 28px;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999;
    }
    #bar button, #bar input, #bar a { -webkit-app-region: no-drag; }
    pear-ctrl[data-platform="darwin"] {
      margin-top: 8px;
      margin-left: 8px;
    }
    #app { height: 100vh; padding-top: 28px; display: flex; flex-direction: column; overflow: hidden; }
  </style>
</head>
<body>
  <div id="bar"><pear-ctrl></pear-ctrl></div>
  <div id="app"></div>
  <script type="module" src="./app/index.js"></script>
</body>
</html>
